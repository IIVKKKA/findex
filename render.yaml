# Render blueprint: New > Blueprint > pick this repo. Configuration comes only from environment variables.
services:
  - type: web
    name: findex
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: INDEX_PATH
        value: /app/index.bin
      - key: WEB_WORKERS
        value: "1"
      - key: LOG_LEVEL
        value: INFO
