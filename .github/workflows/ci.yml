name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest --cov --benchmark-disable
      - name: Benchmarks (search / build_index timings are printed so slowdowns are visible)
        run: uv run pytest tests/test_benchmarks.py --benchmark-only --benchmark-columns=min,mean,stddev,rounds --benchmark-json=benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.json
